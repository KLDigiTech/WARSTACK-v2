<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WARSTACK — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/core/variables.css">
  <link rel="stylesheet" href="css/core/reset.css">
  <link rel="stylesheet" href="css/core/base.css">
  <link rel="stylesheet" href="css/pages/login.css">
</head>

<body class="login-body">

  <div class="login-container">
    <img id="login-server-logo" src="https://placehold.co/128x128" alt="Logo">
    <h1>WARSTACK</h1>
    <button id="discord-login-btn">Se connecter avec Discord</button>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js';

    const { data: { session } } = await supabase.auth.getSession();
    if (session) { window.location.href = '/'; }

    try {
      const guild = await fetch('https://warstack-bot.onrender.com/api/guild').then(r => r.json());
      document.getElementById('login-server-logo').src = guild.icon || 'https://placehold.co/128x128';
    } catch { }

    document.getElementById('discord-login-btn').addEventListener('click', async () => {
      await supabase.auth.signInWithOAuth({
        provider: 'discord',
        options: { redirectTo: 'https://warstack-v2.vercel.app/login' }
      });
    });
  </script>
</body>

</html>
