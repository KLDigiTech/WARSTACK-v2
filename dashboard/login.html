<script type="module">
  import { supabase } from './js/supabaseClient.js';

  const {
    data: { session }
  } = await supabase.auth.getSession();

  // SI connecté => dashboard
  if (session) {
    window.location.href = '/';
  }

  try {
    const guildResponse = await fetch(
      'https://warstack-bot.onrender.com/api/guild'
    );

    const guild = await guildResponse.json();

    document.getElementById('login-server-logo').src =
      guild.icon || 'https://placehold.co/128x128';

  } catch (err) {

    console.error(err);

  }

  document
    .getElementById('discord-login-btn')
    .addEventListener('click', async () => {

      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'discord',
        options: {
          redirectTo: 'https://warstack-v2.vercel.app/login'
        }
      });

      if (error) {
        console.error(error);
      }

    });
</script>
