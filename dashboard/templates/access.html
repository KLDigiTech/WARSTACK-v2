<!-- PANEL PRINCIPAL -->
<div class="panel">
  <div class="panel-header">
    <div>
      <h2>🔐 Gestion des Accès</h2>
      <p>Créer des rôles et gérer qui voit quoi</p>
    </div>
    <button class="btn btn-primary" id="btn-new-role">
      <i class="fas fa-plus"></i> Nouveau rôle
    </button>
  </div>
  <div class="panel-body">

    <!-- TABS -->
    <div class="access-tabs">
      <button class="access-tab active" data-tab="roles">
        <i class="fas fa-tags"></i> Rôles
      </button>
      <button class="access-tab" data-tab="membres">
        <i class="fas fa-users"></i> Membres
      </button>
    </div>

    <!-- TAB RÔLES -->
    <div class="access-tab-content active" id="tab-roles">
      <div class="access-roles-list" id="roles-list">
        <div class="access-loading"><i class="fas fa-spinner fa-spin"></i> Chargement...</div>
      </div>
    </div>

    <!-- TAB MEMBRES -->
    <div class="access-tab-content" id="tab-membres">
      <div class="access-search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="member-search" placeholder="Rechercher un membre..." class="form-input">
      </div>
      <div class="access-members-list" id="members-list">
        <div class="access-loading"><i class="fas fa-spinner fa-spin"></i> Chargement...</div>
      </div>
    </div>

  </div>
</div>

<!-- ═══════════════════════════════════════════
     MODAL RÔLE (centré, scrollable)
═══════════════════════════════════════════ -->
<div class="access-modal" id="role-modal">
  <div class="access-modal-overlay" id="role-modal-overlay"></div>
  <div class="access-modal-box">

    <div class="access-modal-header">
      <h3 id="role-modal-title">Nouveau rôle</h3>
      <button class="access-modal-close" id="btn-close-role-modal">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="access-modal-body">

      <!-- NOM + COULEUR -->
      <div class="access-modal-section">
        <div class="access-section-label">Identité du rôle</div>
        <div class="form-group">
          <label>Nom du rôle</label>
          <input type="text" id="role-name-input" class="form-input" placeholder="Ex: Staff, Caster, Partenaire...">
        </div>
        <div class="form-group">
          <label>Couleur</label>
          <div class="access-color-grid" id="color-grid"></div>
          <div class="access-color-custom-row">
            <div class="access-color-preview" id="color-preview"></div>
            <input type="text" id="color-hex-input" class="form-input" placeholder="#ffffff" maxlength="7">
          </div>
        </div>
      </div>

      <!-- MODULES DASHBOARD -->
      <div class="access-modal-section">
        <div class="access-section-label">
          Modules Dashboard visibles
          <button class="access-check-all-btn" id="btn-check-all-modules">Tout cocher</button>
        </div>
        <div class="access-modules-grid" id="modules-grid"></div>
      </div>

      <!-- SALONS DISCORD -->
      <div class="access-modal-section">
        <div class="access-section-label">
          Salons Discord accessibles
          <button class="access-check-all-btn" id="btn-check-all-channels">Tout cocher</button>
        </div>
        <div class="access-channels-info">
          <i class="fas fa-info-circle"></i>
          Seuls les salons cochés seront visibles pour ce rôle sur Discord.
        </div>
        <div class="access-channels-list" id="channels-list-modal">
          <div class="access-loading"><i class="fas fa-spinner fa-spin"></i> Chargement salons...</div>
        </div>
      </div>

    </div>

    <div class="access-modal-footer">
      <button class="btn btn-danger" id="btn-delete-role" style="display:none">
        <i class="fas fa-trash"></i> Supprimer
      </button>
      <div class="access-modal-footer-right">
        <button class="btn btn-secondary" id="btn-cancel-role-modal">Annuler</button>
        <button class="btn btn-primary" id="btn-save-role">
          <i class="fas fa-save"></i> Sauvegarder
        </button>
      </div>
    </div>

  </div>
</div>

<!-- ═══════════════════════════════════════════
     MODAL MEMBRE
═══════════════════════════════════════════ -->
<div class="access-modal" id="member-modal">
  <div class="access-modal-overlay" id="member-modal-overlay"></div>
  <div class="access-modal-box access-modal-box--sm">

    <div class="access-modal-header">
      <h3 id="member-modal-title">Gérer le membre</h3>
      <button class="access-modal-close" id="btn-close-member-modal">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="access-modal-body">
      <div id="member-info-block"></div>
      <div class="access-modal-section">
        <div class="access-section-label">Rôle Dashboard</div>
        <div class="access-roles-radio" id="roles-radio-list"></div>
      </div>
    </div>

    <div class="access-modal-footer">
      <button class="btn btn-danger" id="btn-remove-member-role">
        <i class="fas fa-user-minus"></i> Retirer le rôle
      </button>
      <div class="access-modal-footer-right">
        <button class="btn btn-secondary" id="btn-cancel-member-modal">Annuler</button>
        <button class="btn btn-primary" id="btn-save-member-role">
          <i class="fas fa-save"></i> Assigner
        </button>
      </div>
    </div>

  </div>
</div>
