<div class="welcome-layout">

  <!-- ══ COLONNE GAUCHE ══ -->
  <div>

    <div class="panel">
      <div class="panel-header">
        <h2>🎂 Configuration</h2>
      </div>
      <div class="panel-body">

        <div class="form-group">
          <div class="toggle-row">
            <label>Activer les anniversaires</label>
            <label class="toggle-switch">
              <input type="checkbox" id="birthday-enabled">
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <div class="welcome-section-title" style="margin-top:1rem">Salon & Heure</div>

        <div class="form-group">
          <label>Salon d'annonce</label>
          <select id="birthday-channel" class="form-select">
            <option value="">Chargement...</option>
          </select>
        </div>

        <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:1rem">
          <div class="form-group">
            <label>Heure d'envoi</label>
            <select id="birthday-hour" class="form-select">
              ${Array.from({length:24}, (_,i) => `<option value="${i}">${String(i).padStart(2,'0')}:00</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>Fuseau horaire</label>
            <select id="birthday-tz" class="form-select">
              <option value="Europe/Paris">Europe/Paris</option>
              <option value="Europe/London">Europe/London</option>
              <option value="America/New_York">America/New_York</option>
              <option value="America/Los_Angeles">America/Los_Angeles</option>
              <option value="Asia/Tokyo">Asia/Tokyo</option>
            </select>
          </div>
        </div>

        <div class="welcome-section-title" style="margin-top:1rem">Rôle temporaire</div>

        <div class="form-group">
          <label>Rôle anniversaire <span style="color:var(--text-muted)">(retiré après 24h)</span></label>
          <select id="birthday-role" class="form-select">
            <option value="">Aucun</option>
          </select>
        </div>

      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>💬 Message</h2>
      </div>
      <div class="panel-body">
        <div class="form-group">
          <div class="variables-bar">
            <span class="var-label">Insérer :</span>
            <button class="var-btn" data-var="{mention}" data-target="birthday-message">{mention}</button>
            <button class="var-btn" data-var="{user}" data-target="birthday-message">{user}</button>
            <button class="var-btn" data-var="{age}" data-target="birthday-message">{age}</button>
            <button class="var-btn" data-var="{server}" data-target="birthday-message">{server}</button>
          </div>
          <textarea id="birthday-message" class="form-textarea" rows="5"
            placeholder="🎂 Joyeux anniversaire {mention} !&#10;Toute la communauté {server} te souhaite une excellente journée ! 🎉"></textarea>
        </div>
      </div>
      <div class="panel-footer" style="justify-content:space-between">
        <button class="btn btn-secondary" id="btn-test-birthday">
          <i class="fas fa-paper-plane"></i> Tester
        </button>
        <button class="btn btn-primary" id="btn-save-birthday">
          <i class="fas fa-save"></i> Sauvegarder
        </button>
      </div>
    </div>

  </div>

  <!-- ══ COLONNE DROITE ══ -->
  <div>

    <div class="panel">
      <div class="panel-header">
        <h2>👁️ Aperçu en direct</h2>
      </div>
      <div class="panel-body">
        <div class="discord-preview-box">
          <div class="discord-preview">
            <div class="dp-avatar">
              <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="bot">
            </div>
            <div class="dp-content">
              <div class="dp-header">
                <span class="dp-botname">WARSTACK</span>
                <span class="dp-badge">APP</span>
                <span class="dp-time">Aujourd'hui à <span id="dp-bday-time">--:--</span></span>
              </div>
              <div class="dp-message" id="dp-birthday-text">🎂 Joyeux anniversaire @Kevin !</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>📅 Prochains anniversaires</h2>
      </div>
      <div class="panel-body">
        <div id="upcoming-birthdays">
          <div style="color:var(--text-muted);font-size:0.85rem">Chargement...</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>👥 Membres enregistrés</h2>
        <span id="birthday-count" style="font-size:0.8rem;color:var(--text-muted)">0 membres</span>
      </div>
      <div class="panel-body">
        <div id="birthday-list">
          <div style="color:var(--text-muted);font-size:0.85rem">Aucun anniversaire enregistré.</div>
        </div>
      </div>
    </div>

  </div>

</div>
