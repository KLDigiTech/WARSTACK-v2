<div class="panel">
  <div class="panel-header">
    <h2>#️⃣ Salons Discord <span class="tooltip-icon"
        data-tooltip="Liste tous les salons et catégories de ton serveur Discord, gérables directement depuis le dashboard.">ⓘ</span>
    </h2>
    <div style="display:flex;gap:0.5rem;">
      <button class="btn btn-danger" id="btn-delete-all">
        <i class="fas fa-trash"></i> Tout supprimer
      </button>
      <button class="btn btn-primary" id="btn-create-channel">
        <i class="fas fa-plus"></i> Créer
      </button>
    </div>
  </div>
  <div class="panel-body">
    <div id="channels-list"></div>
  </div>
</div>

<div class="panel" id="create-channel-form" style="display:none">
  <div class="panel-header">
    <h2>➕ Nouveau salon / catégorie <span class="tooltip-icon"
        data-tooltip="Un salon est un espace de discussion Discord (texte ou vocal). Une catégorie regroupe plusieurs salons ensemble.">ⓘ</span>
    </h2>
  </div>
  <div class="panel-body">

    <div class="form-grid">
      <div class="form-group">
        <label>Type</label>
        <select id="channel-type" class="form-select">
          <option value="0">💬 Salon texte</option>
          <option value="2">🔊 Salon vocal</option>
          <option value="4">📁 Catégorie</option>
        </select>
      </div>
      <div class="form-group">
        <label>Catégorie parente <span class="muted">(optionnel)</span></label>
        <select id="channel-category" class="form-select">
          <option value="">Aucune</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Emoji <span class="muted">(optionnel)</span></label>
      <div class="emoji-grid" id="emoji-grid"></div>
      <div class="emoji-selected" id="emoji-selected">Aucun emoji sélectionné</div>
    </div>

    <div class="form-group">
      <label>Nom du salon</label>
      <div class="channel-name-preview">
        <span id="channel-name-emoji"></span>
        <input type="text" id="channel-name" class="form-input" placeholder="ex: resultats-tournoi">
      </div>
    </div>

  </div>
  <div class="panel-footer">
    <button class="btn btn-secondary" id="btn-cancel-channel">Annuler</button>
    <button class="btn btn-primary" id="btn-confirm-channel">Créer</button>
  </div>
</div>
