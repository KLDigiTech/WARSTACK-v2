<div class="panel">
  <div class="panel-header">
    <h2>🕐 Messages récurrents</h2>
  </div>
  <div class="panel-body">
    <div class="form-grid">
      <div class="form-group">
        <label>Salon</label>
        <input type="text" class="form-input" placeholder="annonces">
      </div>
      <div class="form-group">
        <label>Fréquence</label>
        <select class="form-select">
          <option>Daily</option>
          <option>Weekly</option>
          <option>Monthly</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Message</label>
        <textarea class="form-textarea" rows="4" placeholder="Message automatique..."></textarea>
      </div>
    </div>
  </div>
</div>
