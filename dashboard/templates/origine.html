<!-- ═══ CARTE DU CLAN — WARSTACK ═══ -->

<!-- HERO BANNER -->
<div class="carte-hero">
  <div class="carte-hero-bg"></div>
  <div class="carte-hero-content">
    <div class="carte-hero-title">🗺️ CARTE DU CLAN</div>
    <div class="carte-hero-sub">Découvrez où se trouvent les membres des Potes Ö Feu à travers le monde</div>
    <div class="carte-hero-stats">
      <div class="carte-hero-stat">
        <div class="carte-hero-stat-value" id="stat-locations-total">0</div>
        <div class="carte-hero-stat-label">Membres localisés</div>
      </div>
      <div class="carte-hero-stat-sep"></div>
      <div class="carte-hero-stat">
        <div class="carte-hero-stat-value" id="stat-locations-countries">0</div>
        <div class="carte-hero-stat-label">Pays</div>
      </div>
      <div class="carte-hero-stat-sep"></div>
      <div class="carte-hero-stat">
        <div class="carte-hero-stat-value" id="stat-locations-france">0</div>
        <div class="carte-hero-stat-label">🇫🇷 France</div>
      </div>
      <div class="carte-hero-stat-sep"></div>
      <div class="carte-hero-stat">
        <div class="carte-hero-stat-value" id="stat-locations-regions">0</div>
        <div class="carte-hero-stat-label">Régions</div>
      </div>
    </div>
  </div>
</div>

<!-- LAYOUT PRINCIPAL -->
<div class="carte-layout">

  <!-- COLONNE CARTE -->
  <div class="carte-map-col">
    <div class="panel carte-map-panel">
      <div class="panel-header">
        <h2>🌍 Carte interactive</h2>
        <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
          <select id="map-filter-country" class="form-select" style="width:150px;font-size:0.8rem">
            <option value="all">🌐 Tous les pays</option>
            <option value="France" selected>🇫🇷 France</option>
          </select>
          <button class="btn btn-sm btn-secondary" id="btn-map-reset" title="Recentrer">
            <i class="fas fa-compress-arrows-alt"></i>
          </button>
          <button class="btn btn-sm btn-secondary" id="btn-map-heatmap" title="Heatmap">
            <i class="fas fa-fire"></i>
          </button>
        </div>
      </div>
      <div style="position:relative">
        <div id="membre-map" style="height:520px;width:100%;border-radius:0 0 var(--radius) var(--radius)"></div>
        <!-- Légende -->
        <div class="carte-legend">
          <div class="carte-legend-item"><span class="carte-legend-dot solo"></span>1 membre</div>
          <div class="carte-legend-item"><span class="carte-legend-dot cluster"></span>Cluster</div>
        </div>
        <!-- Tooltip custom -->
        <div id="carte-tooltip" class="carte-tooltip"></div>
      </div>
    </div>
  </div>

  <!-- COLONNE DROITE -->
  <div class="carte-side-col">

    <!-- RECHERCHE + LISTE MEMBRES -->
    <div class="panel">
      <div class="panel-header">
        <h2>👥 Membres</h2>
        <div class="carte-search-wrap">
          <i class="fas fa-search"></i>
          <input type="text" id="location-search" class="form-input" placeholder="Rechercher..." style="border:none;background:transparent;padding-left:0">
        </div>
      </div>
      <div class="panel-body" style="padding:0.5rem;max-height:340px;overflow-y:auto">
        <div id="locations-list">
          <div style="color:var(--text-muted);font-size:0.85rem;padding:1rem">Chargement...</div>
        </div>
      </div>
    </div>

    <!-- TOP RÉGIONS -->
    <div class="panel">
      <div class="panel-header"><h2>📊 Top régions</h2></div>
      <div class="panel-body">
        <div id="regions-list">
          <div style="color:var(--text-muted);font-size:0.85rem">Chargement...</div>
        </div>
      </div>
    </div>

    <!-- TOP PAYS -->
    <div class="panel">
      <div class="panel-header"><h2>🏳️ Top pays</h2></div>
      <div class="panel-body">
        <div id="countries-list">
          <div style="color:var(--text-muted);font-size:0.85rem">Chargement...</div>
        </div>
      </div>
    </div>

  </div>
</div>
