<div class="panel">
  <div class="panel-header">
    <h2>⚙️ Paramètres</h2>
  </div>
  <div class="panel-body">
    <div class="form-grid">
      <div class="form-group">
        <label>Langue</label>
        <select id="settings-language" class="form-select">
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="form-group">
        <label>Préfixe</label>
        <input type="text" id="settings-prefix" class="form-input" placeholder="!">
      </div>
    </div>
  </div>
  <div class="panel-footer">
    <button class="btn btn-primary" id="save-settings">Sauvegarder</button>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <h2>🔑 API</h2>
  </div>
  <div class="panel-body">
    <div class="form-grid">
      <div class="form-group full">
        <label>BOT URL</label>
        <input type="text" id="settings-bot-url" class="form-input" disabled>
      </div>
      <div class="form-group full">
        <label>GUILD ID</label>
        <input type="text" id="settings-guild-id" class="form-input" disabled>
      </div>
    </div>
  </div>
</div>
