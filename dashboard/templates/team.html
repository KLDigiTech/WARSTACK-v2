<div class="section-header">
  <div>
    <h1 class="section-title">👥 Équipe <span class="tooltip-icon"
        data-tooltip="Définit qui fait partie de ton staff et ce que chacun a le droit de voir/faire (Fondateur, Team Leader, Organisateur, Modérateur).">ⓘ</span>
    </h1>
    <p class="section-subtitle">Gérez les membres de votre staff et leurs rôles WARSTACK.</p>
  </div>
  <div style="display:flex;gap:.5rem">
    <button class="btn-secondary" id="btn-manage-roles" style="display:none">🔐 Gérer les rôles</button>
    <button class="btn-primary" id="btn-add-member">+ Ajouter un membre</button>
  </div>
</div>

<div id="team-loading" class="team-loading">
  <div class="spinner"></div>
  <span>Chargement de l'équipe...</span>
</div>

<div id="team-content" style="display:none">

  <!-- TABLEAU MEMBRES -->
  <div class="card" style="margin-bottom:1.5rem">
    <table class="team-table">
      <thead>
        <tr>
          <th>Membre</th>
          <th>Rôle</th>
          <th>Accès</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="team-tbody"></tbody>
    </table>
  </div>

  <!-- PERMISSIONS PAR RÔLE -->
  <div class="card">
    <div class="card-title">Permissions par rôle</div>
    <div class="role-perms-grid" id="role-perms-grid"></div>
  </div>

</div>
