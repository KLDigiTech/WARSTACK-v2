<div class="welcome-layout">

  <!-- ══ COLONNE GAUCHE ══ -->
  <div class="welcome-left">

    <!-- ESSENTIEL -->
    <div class="panel">
      <div class="panel-body">

        <div class="form-group">
          <label>Salon de bienvenue</label>
          <select id="welcome-channel" class="form-select">
            <option value="">Chargement...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Message de bienvenue</label>
          <div class="variables-bar">
            <span class="var-label">Insérer :</span>
            <button class="var-btn" data-var="{mention}" data-target="welcome-message">{mention}</button>
            <button class="var-btn" data-var="{user}"    data-target="welcome-message">{user}</button>
            <button class="var-btn" data-var="{server}"  data-target="welcome-message">{server}</button>
            <button class="var-btn" data-var="{membercount}" data-target="welcome-message">{membercount}</button>
          </div>
          <textarea id="welcome-message" class="form-textarea" rows="4"
            placeholder="Bienvenue {mention} sur {server} ! 🎉&#10;Tu es notre {membercount}ème membre."></textarea>
        </div>

        <!-- RÉGLAGES AVANCÉS -->
        <div class="advanced-toggle" id="advanced-toggle">
          <i class="fas fa-chevron-down"></i> Réglages avancés
        </div>

        <div class="advanced-body" id="advanced-body" style="display:none">

          <div class="form-group">
            <label>Salon de départ <span class="tooltip-icon" data-tooltip="Salon où le bot annonce qu'un membre a quitté.">ⓘ</span></label>
            <select id="leave-channel" class="form-select">
              <option value="">Aucun</option>
            </select>
          </div>

          <div class="form-group">
            <label>Message de départ</label>
            <div class="variables-bar">
              <button class="var-btn" data-var="{user}"        data-target="leave-message">{user}</button>
              <button class="var-btn" data-var="{server}"      data-target="leave-message">{server}</button>
              <button class="var-btn" data-var="{membercount}" data-target="leave-message">{membercount}</button>
            </div>
            <textarea id="leave-message" class="form-textarea" rows="2"
              placeholder="**{user}** a quitté le serveur. Plus que {membercount} membres."></textarea>
          </div>

          <div class="form-group">
            <label>Rôle automatique à l'arrivée <span class="tooltip-icon" data-tooltip="Rôle donné automatiquement à chaque nouveau membre.">ⓘ</span></label>
            <select id="autorole" class="form-select">
              <option value="">Aucun</option>
            </select>
          </div>

          <div class="form-group">
            <div class="toggle-row">
              <label>Envoyer un DM au nouveau membre <span class="tooltip-icon" data-tooltip="Certains membres ont les DM désactivés.">ⓘ</span></label>
              <label class="toggle-switch">
                <input type="checkbox" id="enable-dm">
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>

          <div class="form-group" id="dm-group" style="display:none">
            <textarea id="dm-message" class="form-textarea" rows="3"
              placeholder="Bienvenue {user} sur {server} ! Pense à consulter le règlement."></textarea>
          </div>

        </div>

      </div>

      <div class="panel-footer" style="justify-content:space-between">
        <button class="btn btn-secondary" id="btn-test-welcome">
          <i class="fas fa-paper-plane"></i> Tester
        </button>
        <button class="btn btn-primary" id="save-welcome">
          <i class="fas fa-save"></i> Sauvegarder
        </button>
      </div>
    </div>

  </div>

  <!-- ══ COLONNE DROITE : APERÇU ══ -->
  <div class="welcome-right">
    <div class="panel">
      <div class="panel-header">
        <h2>👁️ Aperçu en direct</h2>
      </div>
      <div class="panel-body">
        <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:1rem">
          Mise à jour en temps réel pendant que tu rédiges.
        </p>

        <div class="welcome-section-title">Message de bienvenue</div>
        <div class="discord-preview-box" style="margin-bottom:1rem">
          <div class="discord-preview">
            <div class="dp-avatar"><img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="bot"></div>
            <div class="dp-content">
              <div class="dp-header">
                <span class="dp-botname">WARSTACK</span>
                <span class="dp-badge">APP</span>
                <span class="dp-time">Aujourd'hui à <span id="dp-time-val">--:--</span></span>
              </div>
              <div class="dp-message" id="dp-welcome-text">Bienvenue @Kevin sur WARSTACK ! 🎉</div>
            </div>
          </div>
        </div>

        <div class="welcome-section-title">Message de départ</div>
        <div class="discord-preview-box">
          <div class="discord-preview">
            <div class="dp-avatar"><img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="bot"></div>
            <div class="dp-content">
              <div class="dp-header">
                <span class="dp-botname">WARSTACK</span>
                <span class="dp-badge">APP</span>
                <span class="dp-time">Aujourd'hui à <span id="dp-time-val-2">--:--</span></span>
              </div>
              <div class="dp-message" id="dp-leave-text">Kevin a quitté le serveur.</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
