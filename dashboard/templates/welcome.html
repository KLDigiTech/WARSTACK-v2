<div class="panel">
  <div class="panel-header">
    <h2>👋 Arrivées / Départs</h2>
  </div>
  <div class="panel-body">
    <div class="form-grid">
      <div class="form-group">
        <label>Salon bienvenue</label>
        <input type="text" id="welcome-channel" class="form-input" placeholder="bienvenue">
      </div>
      <div class="form-group">
        <label>Salon départs</label>
        <input type="text" id="leave-channel" class="form-input" placeholder="départs">
      </div>
      <div class="form-group full">
        <label>Message bienvenue</label>
        <textarea id="welcome-message" class="form-textarea" rows="4"></textarea>
      </div>
      <div class="form-group full">
        <label>Message départ</label>
        <textarea id="leave-message" class="form-textarea" rows="4"></textarea>
      </div>
    </div>
  </div>
  <div class="panel-footer">
    <button class="btn btn-primary" id="save-welcome">Sauvegarder</button>
  </div>
</div>
